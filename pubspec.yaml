name: face_attendance
description: "Face Recognition Attendance App - A professional attendance management system using face recognition technology."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.2
  
  # Local Database
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  
  # Camera & Image
  camera: ^0.11.1
  image: ^4.5.3
  
  # UI Components
  fl_chart: ^0.70.2
  intl: ^0.20.2

  
  # Location
  geolocator: ^13.0.2
  
  # Utilities
  uuid: ^4.5.1
  shared_preferences: ^2.3.5

  sqflite_common_ffi_web: ^1.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  

